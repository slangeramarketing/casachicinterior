<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Enquiry</title>
</head>
<body
  style="
    margin: 0;
    padding: 0;
    background-color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
  "
>
  <table
    width="100%"
    cellpadding="0"
    cellspacing="0"
    style="background-color: #f5f5f5; padding: 20px"
  >
    <tr>
      <td align="center">
        <table
          width="600"
          cellpadding="0"
          cellspacing="0"
          style="
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
          "
        >
          <!-- BANNER IMAGE -->
          <tr>
            <td>
              <img
                src="https://casachicinterior.com/assets/contactEmailBanner.png"
                alt="Interior Design"
                alt="Interior Design"
                width="600"
                style="display: block; width: 100%; height: auto"
              />
            </td>
          </tr>

          <!-- HEADER -->
          <tr>
            <td style="padding: 20px">
              <h2
                style="
                  margin: 0;
                  font-size: 20px;
                  color: #111827;
                "
              >
                New Enquiry Received
              </h2>
              <p
                style="
                  margin-top: 6px;
                  font-size: 14px;
                  color: #6b7280;
                "
              >
                A new client has submitted a query via the CasaChic website.
              </p>
            </td>
          </tr>

          <!-- DETAILS CARD -->
          <tr>
            <td style="padding: 0 20px 20px 20px">
              <table
                width="100%"
                cellpadding="0"
                cellspacing="0"
                style="
                  border: 1px solid #e5e7eb;
                  border-radius: 6px;
                  padding: 16px;
                "
              >
                <tr>
                  <td style="font-size: 14px; color: #374151">
                    <strong>Name:</strong> {{name}}
                  </td>
                </tr>
                <tr>
                  <td style="font-size: 14px; color: #374151; padding-top: 6px">
                    <strong>Email:</strong> {{email}}
                  </td>
                </tr>
                <tr>
                  <td style="font-size: 14px; color: #374151; padding-top: 6px">
                    <strong>Phone:</strong> {{phone}}
                  </td>
                </tr>
                <tr>
                  <td style="font-size: 14px; color: #374151; padding-top: 6px">
                    <strong>City:</strong> {{city}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- MESSAGE -->
          <tr>
            <td style="padding: 0 20px 20px 20px">
              <h4
                style="
                  margin-bottom: 8px;
                  font-size: 15px;
                  color: #111827;
                "
              >
                Client Message
              </h4>
              <div
                style="
                  background-color: #f9fafb;
                  border-left: 4px solid #f97316;
                  padding: 12px;
                  font-size: 14px;
                  color: #374151;
                  line-height: 1.6;
                "
              >
                {{message}}
              </div>
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td
              style="
                background-color: #f97316;
                color: #ffffff;
                padding: 14px 20px;
                text-align: center;
                font-size: 13px;
              "
            >
              CasaChic Interior • New Client Enquiry
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
