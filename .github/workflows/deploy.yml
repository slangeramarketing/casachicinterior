name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            # Create directory if it doesn't exist
            mkdir -p ~/casachicinterior-staging
            
            # Initialize or verify git repository
            if [ ! -d ~/casachicinterior-staging/.git ]; then
              cd ~
              git clone https://github.com/slangeramarketing/casachicinterior.git casachicinterior-staging
            fi
            
            # Navigate and deploy
            cd ~/casachicinterior-staging
            git fetch origin staging
            git reset --hard origin/staging
            npm install
            npm run build
            pm2 restart casachic-staging || pm2 start npm --name "casachic-staging" -- start
