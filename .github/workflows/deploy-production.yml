name: Deploy Production

# Job 1 builds the app on a GitHub runner with no access to the server. It runs on
# pull requests into main and on every push to main. If it fails, nothing is deployed
# and the live site is untouched.
# Job 2 deploys to the VPS, only after job 1 passed, and only for pushes to main
# (or a manual run from the Actions tab).
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-check:
    name: Build check (no server access)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # react-simple-maps@3 declares a React 16-18 peer range; the project runs React 19.
      # Without this flag a fresh install fails with ERESOLVE.
      - run: npm install --legacy-peer-deps --no-audit --no-fund

      - run: npm run build
        env:
          # lib/jwt.ts throws at import time when this is missing, which aborts the build.
          # This is a placeholder only; the real secret lives in the .env on the VPS.
          JWT_SECRET: ci-build-placeholder
          NEXT_TELEMETRY_DISABLED: 1

  deploy:
    name: Deploy to VPS
    needs: build-check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Same VPS as staging, so the existing secrets are reused.
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/slangera/casachicinterior

            # Only tracked files are reset. .env, ecosystem.config.js and
            # public/uploads are untracked/ignored and survive. Never add `git clean` here.
            git fetch origin main
            git reset --hard origin/main

            npm install --legacy-peer-deps --no-audit --no-fund
            rm -rf .next
            npm run build

            # Reached only if the build succeeded (set -e above).
            pm2 restart casachic-basic --update-env || pm2 start npm --name "casachic-basic" -- start
            pm2 save
